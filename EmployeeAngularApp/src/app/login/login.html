<div class="page">
  <div class="login-card">


    <main class="card-body-wrap">
      <div class="form-inner">
        <div class="logo-wrap">
          <span class="logo">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2 M13 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0z M23 21v-2a4 4 0 0 0-3-3.87 M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
          </span>
          <span class="brand-name">Employee app</span>
        </div>

        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to continue to your account</p>

        <div *ngIf="errorMessage" class="alert alert-danger d-flex align-items-center py-2" role="alert">
          <svg class="alert-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 8v4 M12 16h.01 M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0z" />
          </svg>
          <span>{{ errorMessage }}</span>
        </div>

        <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)" novalidate>
          <!-- Username -->
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <div class="field">
              <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2 M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0z" />
              </svg>
              <input id="username"
                     name="username"
                     type="text"
                     class="form-control"
                     [class.is-invalid]="username.invalid && (username.touched || loginForm.submitted)"
                     [(ngModel)]="credentials.Username"
                     #username="ngModel"
                     required
                     autocomplete="username"
                     placeholder="Enter your username" />
              <div class="invalid-feedback">Username is required.</div>
            </div>
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <div class="field">
              <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 11V7a5 5 0 0 1 10 0v4 M5 11h14a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1z" />
              </svg>
              <input id="password"
                     name="password"
                     [type]="showPassword ? 'text' : 'password'"
                     class="form-control has-toggle"
                     [class.is-invalid]="password.invalid && (password.touched || loginForm.submitted)"
                     [(ngModel)]="credentials.Password"
                     #password="ngModel"
                     required
                     minlength="4"
                     autocomplete="current-password"
                     placeholder="Enter your password" />
              <button type="button"
                      class="toggle-btn"
                      (click)="showPassword = !showPassword"
                      [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path *ngIf="!showPassword"
                        d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0z" />
                  <path *ngIf="showPassword"
                        d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94 M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19 M14.12 14.12a3 3 0 1 1-4.24-4.24 M1 1l22 22" />
                </svg>
              </button>
              <div class="invalid-feedback">
                <span *ngIf="password.errors?.['required']">Password is required.</span>
                <span *ngIf="password.errors?.['minlength']">Password must be at least 4 characters.</span>
              </div>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input"
                     type="checkbox"
                     id="remember"
                     name="rememberMe"
                     [(ngModel)]="rememberMe" />
              <label class="form-check-label" for="remember">Remember me</label>
            </div>
          </div>

          <button type="submit" class="btn btn-signin w-100" [disabled]="isLoading()">
            <span *ngIf="isLoading()"
                  class="spinner-border spinner-border-sm me-2"
                  role="status"
                  aria-hidden="true"></span>
            {{ isLoading() ? 'Signing in...' : 'Sign in' }}
          </button>
        </form>
      </div>
    </main>
  </div>
</div>
