
<nav class="sidebar" [class.is-collapsed]="isCollapsed" aria-label="Main navigation">
  <div class="sidebar-header">

    <a class="brand"
       routerLink="/home"
       title="Employee portal">
      <span class="label brand-name">Employee portal</span>
    </a>


    <button class="toggle"
            type="button"
            aria-controls="sidebar-menu"
            [attr.aria-expanded]="!isCollapsed"
            [attr.aria-label]="isCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
            (click)="toggle()">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="m11 17-5-5 5-5" />
        <path d="m18 17-5-5 5-5" />
      </svg>
    </button>
  </div>

  <ul class="menu" id="sidebar-menu">
    <li>
      <a class="nav-link"
         routerLink="/users"
         routerLinkActive="active"
         #usersLink="routerLinkActive"
         [attr.aria-current]="usersLink.isActive ? 'page' : null"
         data-label="Users">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
        <span class="nav-label">Users</span>
      </a>
    </li>

    <li>
      <a class="nav-link"
         routerLink="/departments"
         routerLinkActive="active"
         #departmentsLink="routerLinkActive"
         [attr.aria-current]="departmentsLink.isActive ? 'page' : null"
         data-label="Departments">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="2" width="16" height="20" rx="2" />
          <path d="M9 22v-4h6v4" />
          <path d="M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01" />
        </svg>
        <span class="nav-label">Departments</span>
      </a>
    </li>

    <li>
      <a class="nav-link"
         routerLink="/designations"
         routerLinkActive="active"
         #designationsLink="routerLinkActive"
         [attr.aria-current]="designationsLink.isActive ? 'page' : null"
         data-label="Designations">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="6" />
          <path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11" />
        </svg>
        <span class="nav-label">Designations</span>
      </a>
    </li>
  </ul>
</nav>
